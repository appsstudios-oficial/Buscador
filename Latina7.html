<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copiar y Abrir Enlace</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <button id="btnCopiar">Copiar lista</button>

    <script>
        const urlLista = "http://190.108.89.228:8000/playlist.m3u8";

        document.getElementById('btnCopiar').addEventListener('click', function() {
            // 1. Copiar al portapapeles
            navigator.clipboard.writeText(urlLista).then(() => {
                alert("Enlace copiado al portapapeles");
                
                // 2. Abrir el enlace en una pestaña nueva
                window.open(urlLista, '_blank');
            }).catch(err => {
                console.error('Error al copiar: ', err);
            });
        });
    </script>

</body>
</html>
