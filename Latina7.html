<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copiar Lista</title>
    <style>
        /* Fondo negro y alineación central */
        body {
            background-color: #000000;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Estilo del botón */
        #btnCopiar {
            background-color: #27ae60; /* Verde para que resalte */
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-bottom: 20px;
        }

        #btnCopiar:hover {
            background-color: #2ecc71;
        }

        /* Contenedor del enlace (oculto al inicio) */
        #contenedorEnlace {
            display: none; /* Se oculta por defecto */
            background-color: #1a1a1a;
            padding: 15px;
            border-radius: 5px;
            border: 1px border #333;
            word-break: break-all; /* Para que el link no se corte en móviles */
            color: #00ff00; /* Color verde tipo consola */
            font-family: monospace;
            max-width: 80%;
            text-align: center;
        }
    </style>
</head>
<body>

    <button id="btnCopiar">COPIAR LISTA</button>

    <div id="contenedorEnlace"></div>

    <script>
        const urlLista = "http://190.108.89.228:8000/playlist.m3u8";
        const boton = document.getElementById('btnCopiar');
        const visor = document.getElementById('contenedorEnlace');

        boton.addEventListener('click', function() {
            // 1. Copiar al portapapeles
            navigator.clipboard.writeText(urlLista).then(() => {
                
                // 2. Mostrar el enlace en la pantalla
                visor.textContent = urlLista;
                visor.style.display = "block";
                
                // Opcional: Cambiar el texto del botón temporalmente
                boton.textContent = "¡COPIADO!";
                setTimeout(() => {
                    boton.textContent = "COPIAR LISTA";
                }, 2000);

            }).catch(err => {
                console.error('Error al copiar: ', err);
            });
        });
    </script>

</body>
</html>
