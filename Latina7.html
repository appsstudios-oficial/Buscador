<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista IPTV - Copiar</title>
    <style>
        /* Fondo negro y centrado */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Estilo del botón */
        #btnCopiar {
            background-color: #ff4757; /* Un rojo vibrante */
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }

        #btnCopiar:hover {
            background-color: #ff6b81;
            transform: scale(1.05);
        }

        #btnCopiar:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <button id="btnCopiar">COPIAR LISTA</button>

    <script>
        const urlLista = "http://190.108.89.228:8000/playlist.m3u8";

        document.getElementById('btnCopiar').addEventListener('click', function() {
            // Copiar el enlace al portapapeles
            navigator.clipboard.writeText(urlLista).then(() => {
                console.log("Copiado con éxito");
                
                // Abrir el enlace en una pestaña nueva inmediatamente
                window.open(urlLista, '_blank');
            }).catch(err => {
                // Si falla el portapapeles, intentamos abrir el enlace de todos modos
                window.open(urlLista, '_blank');
                console.error('Error al intentar copiar: ', err);
            });
        });
    </script>

</body>
</html>
